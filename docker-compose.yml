services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_fatah_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_fatah_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ai_fatah_store
      SECRET_KEY: change-this-before-production
      AUTO_CREATE_TABLES: "true"
      WHATSAPP_NUMBER: "923001234567"
      ADMIN_EMAIL: admin@aifatah.pk
      ADMIN_PASSWORD: ChangeMe123!
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
